name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # engine ที่คำนวณดอกเบี้ยผิดแล้วขึ้น production คือสิ่งที่แอพนี้มีไว้เพื่อป้องกัน
      # TV-1..TV-33 ต้องผ่านครบ ไม่งั้นไม่ deploy
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # ข้ามเงียบ ๆ ถ้ายังไม่ได้ตั้ง secret ของ Cloudflare — ไม่ทำให้ CI แดงโดยไม่จำเป็น
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
