<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PonWai</title>
    <meta name="description" content="เปรียบเทียบและติดตามสินเชื่อบ้าน ให้ตัวเลขตรงกับใบแจ้งยอดธนาคารระดับสตางค์" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f5f1" />
    <!-- ชื่อที่ขึ้นใต้ไอคอนตอน Add to Home Screen บน iOS อ่านจากคีย์นี้ ไม่ใช่จาก manifest -->
    <meta name="apple-mobile-web-app-title" content="PonWai" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin จำเป็น: ถ้าไม่ใส่ คำขอเป็น no-cors แล้ว response เป็น opaque
         (status 0, ok false) ซึ่ง service worker เก็บลง cache ไม่ได้
         พอออฟไลน์ CSS โหลดไม่ได้ @font-face จึงไม่มี ฟอนต์ไทยตกไปใช้ฟอนต์ระบบ
         และไฟล์ woff2 ที่ cache ไว้แล้วก็ไม่มีใครอ้างถึง -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap"
      rel="stylesheet"
      crossorigin
    />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
